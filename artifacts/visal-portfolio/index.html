<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- Title shown on browser tabs and social previews -->
    <title>Visal Phal | Portfolio</title>

    <!-- Standard Meta Description -->
    <meta
      name="description"
      content="Welcome to my personal portfolio showcasing my latest web development projects, skills, and experience."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph Meta Tags (Used by Facebook, Telegram, LinkedIn, Discord) -->
    <meta property="og:title" content="Visal Phal | Portfolio" />
    <meta
      property="og:description"
      content="Welcome to my personal portfolio showcasing my latest web development projects, skills, and experience."
    />
    <meta property="og:type" content="website" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Visal Phal | Portfolio" />
    <meta
      name="twitter:description"
      content="Welcome to my personal portfolio showcasing my latest web development projects, skills, and experience."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
